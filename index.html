<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rusça Harf Çizim Pratiği</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 360px;
            width: 100%;
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .letter-info {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .canvas-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 15px auto;
            border-radius: 16px;
            overflow: hidden;
            background-color: #0f172a;
            border: 2px solid #334155;
        }

        .guide-letter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.12);
            user-select: none;
            pointer-events: none;
            font-family: Arial, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 280px;
            height: 280px;
            cursor: crosshair;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-check {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .btn-clear {
            background-color: #334155;
            color: #ffffff;
        }

        .feedback {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 28px;
        }

        .correct { color: #4ade80; }
        .wrong { color: #f87171; }
    </style>
</head>
<body>

<div class="card">
    <h1>Harfi Çizgilerden Takip Et</h1>
    <div id="letterInfo" class="letter-info">А (Okunuşu: A)</div>

    <div class="canvas-container">
        <div id="guideLetter" class="guide-letter">А</div>
        <canvas id="paintCanvas" width="280" height="280"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn-clear" onclick="clearCanvas()">Temizle</button>
        <button class="btn-check" onclick="checkDrawing()">Kontrol Et</button>
    </div>

    <div id="feedback" class="feedback"></div>
</div>

<script>
    const letters = [
        { cyr: 'А', sound: 'A' }, { cyr: 'Б', sound: 'B' }, { cyr: 'В', sound: 'V' },
        { cyr: 'Г', sound: 'G' }, { cyr: 'Д', sound: 'D' }, { cyr: 'Е', sound: 'YE' },
        { cyr: 'Ё', sound: 'YO' }, { cyr: 'Ж', sound: 'J' }, { cyr: 'З', sound: 'Z' },
        { cyr: 'И', sound: 'İ' }, { cyr: 'К', sound: 'K' }, { cyr: 'Л', sound: 'L' },
        { cyr: 'М', sound: 'M' }, { cyr: 'Н', sound: 'N' }, { cyr: 'О', sound: 'O' },
        { cyr: 'П', sound: 'P' }, { cyr: 'Р', sound: 'R' }, { cyr: 'С', sound: 'S' },
        { cyr: 'Т', sound: 'T' }, { cyr: 'У', sound: 'U' }, { cyr: 'Ф', sound: 'F' },
        { cyr: 'Х', sound: 'H' }, { cyr: 'Ч', sound: 'Ç' }, { cyr: 'Ш', sound: 'Ş' },
        { cyr: 'Я', sound: 'YA' }
    ];

    const praises = [
        "Aferin sana! Harika çizdin! 🎉",
        "Mükemmel! Tam üstünden geçtin! 🔥",
        "Süper! Çok temiz çizim 👏",
        "İşte bu kadar! Harika! 🚀"
    ];

    let currentIdx = 0;
    let isDrawing = false;
    let drawnPixels = 0;

    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');

    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#38bdf8';

    function startPosition(e) {
        isDrawing = true;
        draw(e);
    }

    function finishedPosition() {
        isDrawing = false;
        ctx.beginPath();
    }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function draw(e) {
        if (!isDrawing) return;
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        drawnPixels++;
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', finishedPosition);
    canvas.addEventListener('mousemove', draw);

    canvas.addEventListener('touchstart', startPosition);
    canvas.addEventListener('touchend', finishedPosition);
    canvas.addEventListener('touchmove', draw);

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        drawnPixels = 0;
        document.getElementById('feedback').innerText = '';
    }

    function checkDrawing() {
        const feedback = document.getElementById('feedback');
        
        // Çizim miktarını kontrol et
        if (drawnPixels > 25) {
            const randomPraise = praises[Math.floor(Math.random() * praises.length)];
            feedback.innerText = randomPraise;
            feedback.className = "feedback correct";
            
            setTimeout(() => {
                currentIdx = (currentIdx + 1) % letters.length;
                loadLetter();
            }, 1200);
        } else {
            feedback.innerText = "Harfin üzerinden biraz daha çizmelisin! ✏️";
            feedback.className = "feedback wrong";
        }
    }

    function loadLetter() {
        clearCanvas();
        const item = letters[currentIdx];
        document.getElementById('guideLetter').innerText = item.cyr;
        document.getElementById('letterInfo').innerText = `${item.cyr} (Okunuşu: ${item.sound})`;
    }

    loadLetter();
</script>

</body>
</html>
